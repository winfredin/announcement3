<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瀏覽公告事項</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .table th { background-color: #f1f3f5; font-weight: 600; white-space: nowrap; }
        .badge-category { background-color: #0d6efd; color: #fff; font-size: 0.8rem; padding: 3px 8px; border-radius: 3px; margin-right: 6px; }
        .pagination .page-item.active .page-link { background-color: #0d6efd; border-color: #0d6efd; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="list.html">
            <i class="bi bi-megaphone-fill me-2"></i>公告管理系統（REST API）
        </a>
    </div>
</nav>

<div class="container mt-4">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center py-3">
            <div>
                <span class="badge-category">公告</span>
                <span class="fw-semibold fs-6">瀏覽公告事項</span>
            </div>
            <a href="add.html" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i>新增公告
            </a>
        </div>

        <div class="card-body p-0">
            <table class="table table-hover table-bordered mb-0">
                <thead>
                    <tr>
                        <th style="width:45%">標題</th>
                        <th style="width:15%" class="text-center">張貼日期</th>
                        <th style="width:15%" class="text-center">截止日期</th>
                        <th style="width:10%" class="text-center">公佈者</th>
                        <th style="width:8%" class="text-center">修改</th>
                        <th style="width:7%" class="text-center">刪除</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="6" class="text-center py-4">載入中...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="card-footer d-flex justify-content-between align-items-center">
            <small class="text-muted" id="pageInfo"></small>
            <nav>
                <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
            </nav>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentPage = 1;

    async function loadPage(page) {
        currentPage = page;
        const res = await fetch(`api/announcements?page=${page}`);
        const data = await res.json();
        renderTable(data);
        renderPagination(data);
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        if (data.announcements.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">目前沒有公告資料</td></tr>';
            return;
        }
        tbody.innerHTML = data.announcements.map(ann => `
            <tr>
                <td>
                    <a href="edit.html?id=${ann.id}" class="text-decoration-none text-dark fw-semibold">${escHtml(ann.title)}</a>
                    ${ann.fileName ? `<a href="api/announcements/${ann.id}/download" class="ms-2 text-muted" title="下載附件: ${escHtml(ann.fileName)}"><i class="bi bi-paperclip"></i></a>` : ''}
                </td>
                <td class="text-center">${ann.postDate}</td>
                <td class="text-center">${ann.expiryDate}</td>
                <td class="text-center">${escHtml(ann.publisher)}</td>
                <td class="text-center">
                    <a href="edit.html?id=${ann.id}" class="btn btn-sm btn-outline-primary py-0 px-2">
                        <i class="bi bi-pencil-square"></i> 修改
                    </a>
                </td>
                <td class="text-center">
                    <button onclick="deleteAnn(${ann.id}, '${escHtml(ann.title)}')"
                            class="btn btn-sm btn-outline-danger py-0 px-2">
                        <i class="bi bi-trash3"></i> 刪除
                    </button>
                </td>
            </tr>
        `).join('');

        document.getElementById('pageInfo').textContent =
            `共 ${data.total} 筆資料，第 ${data.currentPage} / ${data.totalPages} 頁`;
    }

    function renderPagination(data) {
        const { currentPage, totalPages } = data;
        const ul = document.getElementById('pagination');
        let html = '';

        html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="loadPage(1)">首頁</a></li>`;
        html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="loadPage(${currentPage - 1})">上頁</a></li>`;

        for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
            html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                <a class="page-link" href="#" onclick="loadPage(${i})">${i}</a></li>`;
        }

        html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="loadPage(${currentPage + 1})">下頁</a></li>`;
        html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="loadPage(${totalPages})">末頁</a></li>`;

        ul.innerHTML = html;
    }

    async function deleteAnn(id, title) {
        if (!confirm(`確定要刪除「${title}」嗎？`)) return;
        await fetch(`api/announcements/${id}`, { method: 'DELETE' });
        loadPage(currentPage);
    }

    function escHtml(str) {
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    loadPage(1);
</script>
</body>
</html>
