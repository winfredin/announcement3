<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增公佈事項</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-bs5.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .form-label { font-weight: 500; }
        .card-header { background-color: #fff; border-bottom: 2px solid #dee2e6; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="list.html">
            <i class="bi bi-megaphone-fill me-2"></i>公告管理系統（REST API）
        </a>
    </div>
</nav>

<div class="container mt-4" style="max-width: 860px;">
    <div class="card">
        <div class="card-header py-3">
            <h6 class="mb-0 fw-semibold">
                <i class="bi bi-plus-circle me-2 text-primary"></i>新增公佈事項
            </h6>
        </div>
        <div class="card-body">
            <form id="addForm">
                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label">標題</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" name="title" required maxlength="255">
                    </div>
                </div>
                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label">張貼日期</label>
                    <div class="col-sm-4">
                        <input type="date" class="form-control" name="postDate" id="postDate" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label">截止日期</label>
                    <div class="col-sm-4">
                        <input type="date" class="form-control" name="expiryDate" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label">公佈者</label>
                    <div class="col-sm-4">
                        <input type="text" class="form-control" name="publisher" value="Administrator" required maxlength="100">
                    </div>
                </div>
                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label">公佈內容</label>
                    <div class="col-sm-10">
                        <textarea id="content" name="content" class="form-control" rows="10"></textarea>
                    </div>
                </div>
                <div class="row mb-4">
                    <label class="col-sm-2 col-form-label">附件</label>
                    <div class="col-sm-10">
                        <input type="file" class="form-control" name="attachFile">
                        <div class="form-text">最大 20MB</div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-10 offset-sm-2">
                        <button type="submit" class="btn btn-primary me-2">
                            <i class="bi bi-check-lg me-1"></i>儲存
                        </button>
                        <a href="list.html" class="btn btn-secondary">
                            <i class="bi bi-x-lg me-1"></i>取消
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    $.fn.tooltip = function(option) {
        return this.each(function() {
            var $el = $(this), data = $el.data('bs.tooltip'), opts = typeof option === 'object' ? option : {};
            if (!data) $el.data('bs.tooltip', new bootstrap.Tooltip(this, opts));
            if (typeof option === 'string' && data) data[option]();
        });
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-bs5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/lang/summernote-zh-TW.min.js"></script>
<script>
    document.getElementById('postDate').valueAsDate = new Date();

    $('#content').summernote({
        lang: 'zh-TW', height: 300,
        toolbar: [
            ['style', ['bold', 'italic', 'underline', 'strikethrough', 'clear']],
            ['font', ['fontname', 'fontsize', 'color', 'forecolor', 'backcolor']],
            ['para', ['ul', 'ol', 'paragraph']],
            ['insert', ['link', 'picture', 'table', 'hr']],
            ['view', ['codeview']]
        ]
    });

    document.getElementById('addForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        // 把 Summernote 內容同步到 textarea
        $('#content').val($('#content').summernote('code'));

        const formData = new FormData(this);
        const res = await fetch('api/announcements', { method: 'POST', body: formData });

        if (res.ok) {
            window.location.href = 'list.html';
        } else {
            alert('儲存失敗，請重試');
        }
    });
</script>
</body>
</html>
