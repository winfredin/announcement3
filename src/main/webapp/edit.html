<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編輯公佈事項</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .form-label { font-weight: 500; }
        .card-header { background-color: #fff; border-bottom: 2px solid #dee2e6; }
        .existing-file { background: #fff3cd; border: 1px solid #ffc107; border-radius: 4px; padding: 8px 12px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="list.html">
            <i class="bi bi-megaphone-fill me-2"></i>公告管理系統（REST API）
        </a>
    </div>
</nav>

<div class="container mt-4" style="max-width: 860px;">
    <div class="card">
        <div class="card-header py-3">
            <h6 class="mb-0 fw-semibold">
                <i class="bi bi-pencil-square me-2 text-primary"></i>編輯公佈事項
            </h6>
        </div>
        <div class="card-body">
            <form id="editForm">
                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label">標題</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" name="title" id="title" required maxlength="255">
                    </div>
                </div>
                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label">張貼日期</label>
                    <div class="col-sm-4">
                        <input type="date" class="form-control" name="postDate" id="postDate" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label">截止日期</label>
                    <div class="col-sm-4">
                        <input type="date" class="form-control" name="expiryDate" id="expiryDate" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label">公佈者</label>
                    <div class="col-sm-4">
                        <input type="text" class="form-control" name="publisher" id="publisher" required maxlength="100">
                    </div>
                </div>
                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label">公佈內容</label>
                    <div class="col-sm-10">
                        <textarea id="content" name="content" class="form-control" rows="10"></textarea>
                    </div>
                </div>
                <div id="existingFileRow" class="row mb-2" style="display:none">
                    <div class="col-sm-10 offset-sm-2">
                        <div class="existing-file">
                            <i class="bi bi-paperclip me-1"></i>
                            目前附件：<a id="existingFileLink" href="#">-</a>
                            <span class="text-muted ms-2">（若要更換請選擇新檔案）</span>
                        </div>
                    </div>
                </div>
                <div class="row mb-4">
                    <label class="col-sm-2 col-form-label" id="fileLabel">附件</label>
                    <div class="col-sm-10">
                        <input type="file" class="form-control" name="attachFile">
                        <div class="form-text">不選則保留現有附件</div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-10 offset-sm-2">
                        <button type="submit" class="btn btn-primary me-2">
                            <i class="bi bi-check-lg me-1"></i>儲存修改
                        </button>
                        <a href="list.html" class="btn btn-secondary">
                            <i class="bi bi-x-lg me-1"></i>取消
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.ckeditor.com/4.22.1/standard/ckeditor.js"></script>
<script>
    // 從 URL 取得 id，例如 edit.html?id=5
    const id = new URLSearchParams(window.location.search).get('id');
    if (!id) window.location.href = 'list.html';

    CKEDITOR.replace('content', {
        language: 'zh', height: 300,
        toolbar: [
            { name: 'basicstyles', items: ['Bold','Italic','Underline','Strike','-','RemoveFormat'] },
            { name: 'paragraph', items: ['NumberedList','BulletedList','-','JustifyLeft','JustifyCenter','JustifyRight'] },
            { name: 'styles', items: ['Format','Font','FontSize'] },
            { name: 'colors', items: ['TextColor','BGColor'] },
            { name: 'links', items: ['Link','Unlink'] },
            { name: 'insert', items: ['Image','Table','HorizontalRule'] },
            { name: 'tools', items: ['Source'] }
        ]
    });

    // 載入現有資料
    async function loadAnnouncement() {
        const res = await fetch(`api/announcements/${id}`);
        if (!res.ok) { alert('找不到公告'); window.location.href = 'list.html'; return; }
        const ann = await res.json();

        document.getElementById('title').value = ann.title;
        document.getElementById('postDate').value = ann.postDate;
        document.getElementById('expiryDate').value = ann.expiryDate;
        document.getElementById('publisher').value = ann.publisher;

        // 設定 CKEditor 內容
        CKEDITOR.instances.content.setData(ann.content || '');

        // 顯示現有附件
        if (ann.fileName) {
            document.getElementById('existingFileRow').style.display = '';
            const link = document.getElementById('existingFileLink');
            link.textContent = ann.fileName;
            link.href = `api/announcements/${id}/download`;
            document.getElementById('fileLabel').textContent = '更換附件';
        }
    }

    document.getElementById('editForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        for (const instance in CKEDITOR.instances) {
            CKEDITOR.instances[instance].updateElement();
        }

        const formData = new FormData(this);
        const res = await fetch(`api/announcements/${id}`, {
            method: 'PUT',
            body: formData
        });

        if (res.ok) {
            window.location.href = 'list.html';
        } else {
            alert('儲存失敗，請重試');
        }
    });

    loadAnnouncement();
</script>
</body>
</html>
