<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瀏覽公告事項</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .table th { background-color: #f1f3f5; font-weight: 600; white-space: nowrap; }
        .badge-category { background-color: #0d6efd; color: #fff; font-size: 0.8rem; padding: 3px 8px; border-radius: 3px; margin-right: 6px; }
        div.dataTables_wrapper div.dataTables_paginate ul.pagination { margin: 0; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="list.html">
            <i class="bi bi-megaphone-fill me-2"></i>公告管理系統（REST API）
        </a>
    </div>
</nav>

<div class="container mt-4">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center py-3">
            <div>
                <span class="badge-category">公告</span>
                <span class="fw-semibold fs-6">瀏覽公告事項</span>
            </div>
            <a href="add.html" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i>新增公告
            </a>
        </div>

        <div class="card-body p-0">
            <div class="table-responsive p-3">
            <table id="announcementTable" class="table table-hover table-bordered mb-0 w-100">
                <thead>
                    <tr>
                        <th>標題</th>
                        <th class="text-center" style="width:110px">張貼日期</th>
                        <th class="text-center" style="width:110px">截止日期</th>
                        <th class="text-center" style="width:110px">公佈者</th>
                        <th class="text-center" style="width:120px">操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
<script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script>
<script>
    let dtTable = null;

    async function loadAllAndInit() {
        // 取得第一頁，得知 totalPages
        const first = await fetch('api/announcements?page=1').then(r => r.json());
        const { totalPages } = first;

        // 同時抓取所有頁
        const pages = [first];
        if (totalPages > 1) {
            const rest = await Promise.all(
                Array.from({length: totalPages - 1}, (_, i) =>
                    fetch(`api/announcements?page=${i + 2}`).then(r => r.json())
                )
            );
            pages.push(...rest);
        }

        const all = pages.flatMap(p => p.announcements);
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = all.map(ann => `
            <tr>
                <td>
                    <a href="edit.html?id=${ann.id}" class="text-decoration-none text-dark fw-semibold">${escHtml(ann.title)}</a>
                    ${ann.fileName ? `<a href="api/announcements/${ann.id}/download" class="ms-2 text-muted" title="下載附件: ${escHtml(ann.fileName)}"><i class="bi bi-paperclip"></i></a>` : ''}
                </td>
                <td class="text-center">${ann.postDate}</td>
                <td class="text-center">${ann.expiryDate}</td>
                <td class="text-center">${escHtml(ann.publisher)}</td>
                <td class="text-center text-nowrap">
                    <a href="edit.html?id=${ann.id}" class="btn btn-sm btn-outline-primary py-0 px-2 me-1">
                        <i class="bi bi-pencil-square"></i> 修改
                    </a>
                    <button onclick="deleteAnn(${ann.id}, '${escHtml(ann.title)}')"
                            class="btn btn-sm btn-outline-danger py-0 px-2">
                        <i class="bi bi-trash3"></i> 刪除
                    </button>
                </td>
            </tr>
        `).join('');

        dtTable = $('#announcementTable').DataTable({
            language: { url: 'https://cdn.datatables.net/plug-ins/2.1.8/i18n/zh-HANT.json' },
            pageLength: 10,
            lengthMenu: [5, 10, 25, 50],
            order: [[1, 'desc']],
            columnDefs: [{ orderable: false, targets: 4 }],
            responsive: true
        });
    }

    async function deleteAnn(id, title) {
        if (!confirm(`確定要刪除「${title}」嗎？`)) return;
        await fetch(`api/announcements/${id}`, { method: 'DELETE' });
        if (dtTable) { dtTable.destroy(); dtTable = null; }
        document.getElementById('tableBody').innerHTML = '';
        loadAllAndInit();
    }

    function escHtml(str) {
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    loadAllAndInit();
</script>
</body>
</html>
